name: Data Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip' # Caches dependencies to speed up future runs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pinning versions to match the Docker environment and avoid breaking changes
        pip install pytest==8.0.0 pyspark==3.5.1 apache-airflow==2.8.1 apache-airflow-providers-amazon==8.13.0 ruff==0.3.0

    - name: Lint with Ruff
      run: |
        # Run linting on all Python directories
        python -m ruff check dags/ spark_jobs/ lambda/ scripts/

    - name: Run PyTest
      run: |
        # Set AIRFLOW_HOME so Airflow doesn't try to create a default DB in the runner's root
        export AIRFLOW_HOME=$(pwd)/.airflow_ci
        python -m pytest tests/ -v